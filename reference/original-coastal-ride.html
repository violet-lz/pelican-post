<title>今天，顺风。 · Pelican Coast Club</title>
<style>

:root{--paper:#f5f3eb;--panel:#fffdf7;--ink:#294b49;--muted:#788880;--line:#dce1d5;--accent:#c57453;--ui:#3e7165;--ui-2:#315d53;--bg-top:#f5f3eb;--bg-bot:#f5f3eb;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;transition:background .6s,color .6s}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:disabled{cursor:default}svg{display:block}.page{width:min(1180px,calc(100% - 72px));margin:0 auto}.masthead{height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:2.5px;font-weight:750}.brand svg{width:32px;height:32px}.edition{color:var(--muted);font-size:10px;letter-spacing:2px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:28px 0 26px}.eyebrow{margin:0 0 10px;font-size:10px;letter-spacing:3.2px;color:var(--accent);font-weight:700}h1{margin:0;font-size:clamp(34px,4.2vw,56px);letter-spacing:-2px;line-height:1.18;font-weight:650}h1 em{font-style:normal;color:var(--accent)}.intro-copy{margin:0 0 4px;font-size:12px;line-height:1.9;color:var(--muted)}.ride-card{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 15px 45px #294b490b}.stage{position:relative;overflow:hidden;background:#d9e9dc}.stage>svg{width:100%;height:auto;aspect-ratio:1200/630}.scene-topline{position:absolute;top:22px;left:26px;right:26px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;color:#355a57;z-index:1;transition:color .5s}.scene-tag{font-size:9px;font-weight:650;letter-spacing:2.3px}.weather{display:flex;align-items:center;gap:7px;font-size:10px;padding:7px 11px;border-radius:20px;background:#fffdf64a;border:1px solid #fffdf647;backdrop-filter:blur(8px)}.weather-dot{width:5px;height:5px;border-radius:50%;background:#bd8558}.controls{position:relative;display:flex;align-items:center;gap:10px;padding:16px 22px;background:var(--panel);border-top:1px solid var(--line)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:10px 14px;border:1px solid var(--line);border-radius:100px;color:var(--ink);background:transparent;font-size:12px;white-space:nowrap;transition:background .2s,transform .2s,border-color .2s}.btn:hover{background:color-mix(in srgb,var(--ink) 6%,transparent);border-color:var(--muted)}.btn:active{transform:scale(.96)}.btn.primary{color:#fffdf7;background:var(--ui);border-color:var(--ui)}.btn.primary:hover{background:var(--ui-2)}.ico{width:15px;height:15px;display:flex;align-items:center;justify-content:center}.ico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.slider-box{display:flex;align-items:center;justify-content:center;gap:10px;margin-left:10px;color:var(--muted);font-size:11px;white-space:nowrap}.slider-box label{font-size:11px}.slider-box input{width:110px;height:22px;cursor:pointer;accent-color:var(--ui)}#speedVal{width:34px;font-variant-numeric:tabular-nums;color:var(--ink)}.time-tabs{display:flex;gap:2px;border:1px solid var(--line);padding:3px;border-radius:30px;margin-left:auto}.time-tab{min-height:34px;border:0;border-radius:30px;color:var(--muted);background:transparent;padding:7px 12px;font-size:11px;white-space:nowrap}.time-tab[aria-pressed=true]{background:var(--ui);color:#fffdf7}.time-tab:hover{color:var(--accent)}.time-tab[aria-pressed=true]:hover{color:white}.ride-footer{display:flex;align-items:center;justify-content:space-between;padding:17px 4px 26px;gap:12px;color:var(--muted);font-size:10px}.hint{margin:0;letter-spacing:.3px}.hint kbd{font:inherit;padding:2px 4px;border:1px solid var(--line);border-radius:4px;margin-right:2px}.footer-copy{letter-spacing:1.5px;font-size:9px}.badge{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:7px 13px;border-radius:20px;background:#294b49d9;color:#fffdf7;font-size:11px;text-align:center;display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.mode-sunset{--paper:#f4ede4;--panel:#fff7ec;--ink:#5b494c;--muted:#987970;--line:#e3d7c9;--accent:#b66646;--ui:#7a6356;--ui-2:#655044}.mode-night{--paper:#14292e;--panel:#1b3439;--ink:#e3e8d9;--muted:#b0c3b9;--line:#365056;--accent:#e9ba7c;--ui:#557e72;--ui-2:#659483;color-scheme:dark}.mode-night .scene-topline{color:#d6e3da}.mode-night .weather{background:#173a42a6;border-color:#77948b55;color:#e8eddf}.mode-sunset .scene-topline{color:#785955}.scene-focus{position:absolute;right:20px;bottom:17px;border:1px solid #fff7;border-radius:100px;color:#fffdf7;background:#244d4b45;width:34px;height:34px;display:grid;place-items:center;backdrop-filter:blur(6px)}.scene-focus svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}.stage:fullscreen{background:#152e32;display:flex;align-items:center;justify-content:center}.stage:fullscreen>svg{width:100%;max-height:100vh;aspect-ratio:auto}.stage:fullscreen .scene-topline{top:30px}.stage:fullscreen .scene-focus{bottom:25px}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}.tw{animation:tw 3.2s ease-in-out infinite}.tw2{animation-duration:4.7s;animation-delay:-1.6s}.tw3{animation-duration:2.3s;animation-delay:-.9s}.is-paused,.is-paused *{animation-play-state:paused}
@media(min-width:1600px){.page{width:min(1300px,calc(100% - 120px))}.intro{padding-top:40px;padding-bottom:32px}}
@media(max-width:1000px){.controls{flex-wrap:wrap;gap:10px;padding:14px 18px}.slider-box{margin-left:auto}.time-tabs{margin-left:0}.time-tab{padding:7px 11px}}
@media(max-width:700px){.page{width:calc(100% - 28px)}.masthead{height:65px}.brand{font-size:9px;letter-spacing:1.7px;gap:7px}.brand svg{width:27px;height:27px}.edition{font-size:8px;letter-spacing:1px}.intro{padding:24px 3px 23px;display:block}.eyebrow{font-size:8px;letter-spacing:2.3px}h1{font-size:36px;letter-spacing:-1.5px}.intro-copy{font-size:11px;margin:12px 0 0}.intro-copy br{display:none}.ride-card{border-radius:17px}.stage>svg{aspect-ratio:750/620}.scene-topline{top:14px;left:15px;right:15px}.scene-tag{font-size:7px;letter-spacing:1.1px}.weather{font-size:9px;padding:5px 8px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 8px;padding:14px}.btn{width:100%;min-height:43px;font-size:11px;padding:10px 6px;gap:6px}.slider-box{grid-column:1/-1;margin:0;padding:2px 2px}.slider-box input{flex:1;width:auto;min-width:40px}.time-tabs{grid-column:1/-1;width:100%;padding:4px;gap:4px;margin:0}.time-tab{flex:1;min-height:36px}.ride-footer{align-items:flex-start;padding:16px 3px 23px;font-size:9px;line-height:1.8}.hint{display:none}.footer-copy{font-size:8px;letter-spacing:.8px}.scene-focus{right:13px;bottom:13px;width:30px;height:30px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

<body>
<div class="page">
<header class="masthead"><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#e2e8d9"/><path d="M6 23c0-6 4-10 9-9h3v-4c0-4 6-5 7-1l1 3 5 2-8 2c-2 7-7 10-14 8Z" fill="#658574"/><circle cx="22" cy="10" r="1" fill="#fffdf4"/></svg>PELICAN COAST CLUB</div><span class="edition">海岸漫游 · Nº 001</span></header>
<main><div class="intro"><div><p class="eyebrow">A LITTLE RIDE, A LITTLE JOY</p><h1>今天，<em>顺风。</em></h1></div><p class="intro-copy">把日子调慢一点，把海风装进车筐。<br>一只鹈鹕的海岸漫游，现在出发。</p></div>
<section class="ride-card" aria-label="鹈鹕的海岸骑行"><div class="stage" id="stage">
<div class="scene-topline"><span class="scene-tag">THE COAST IS CALLING</span><span class="weather"><i class="weather-dot"></i><span id="weatherText">晨光 · 微风 · 宜出游</span></span></div>
  <svg id="scene" viewBox="0 40 1200 630" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="戴鼠尾草绿头盔的鹈鹕骑着复古自行车沿海岸前行，车筐中有小花，喉囊里有一条小鱼" xmlns="http://www.w3.org/2000/svg">
    <title>鹈鹕骑车记</title>
    <desc>海滨公路上，一只戴头盔和墨镜的鹈鹕踩着脚踏车前行，喉囊里藏着一条戴墨镜的小鱼，车头挂着装有小花和风车的藤编车筐，背景有灯塔、海岛、海鸥与可以切换的晨光、落日与星夜。</desc>

    <!-- SECTION: defs -->
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="skyS1" offset="0%"   stop-color="#48dbfb"/>
        <stop id="skyS2" offset="52%"  stop-color="#feca57"/>
        <stop id="skyS3" offset="100%" stop-color="#d1b0ac"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="seaS1" offset="0%"   stop-color="#1dd1a1"/>
        <stop id="seaS2" offset="45%"  stop-color="#10ac84"/>
        <stop id="seaS3" offset="100%" stop-color="#547e72"/>
      </linearGradient>
      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="roadS1" offset="0%" stop-color="#687a71"/>
        <stop id="roadS2" offset="100%" stop-color="#4c625c"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop id="glowS1" offset="0%"   stop-color="#fffdf4" stop-opacity=".92"/>
        <stop id="glowS2" offset="34%"  stop-color="#f7dca0" stop-opacity=".55"/>
        <stop id="glowS3" offset="70%"  stop-color="#e2ac66" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#e2ac66" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e6ebef"/><stop offset="50%" stop-color="#9dacaa"/><stop offset="100%" stop-color="#636e72"/>
      </linearGradient>
      <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#477968"/><stop offset="100%" stop-color="#95b69a"/>
      </linearGradient>
      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2=".5">
        <stop offset="0%" stop-color="#efb667"/><stop offset="62%" stop-color="#e6a05d"/><stop offset="100%" stop-color="#d48557"/>
      </linearGradient>
      <linearGradient id="pouchGrad" x1=".2" y1="0" x2=".8" y2="1">
        <stop offset="0%" stop-color="#f4cf8f"/><stop offset="48%" stop-color="#edbb7e"/><stop offset="100%" stop-color="#dc985f"/>
      </linearGradient>
      <linearGradient id="featherGrad" x1="0" y1="0" x2=".6" y2="1">
        <stop offset="0%" stop-color="#fffdf4"/><stop offset="70%" stop-color="#f6f3e7"/><stop offset="100%" stop-color="#d8dfd2"/>
      </linearGradient>
      <linearGradient id="lensGrad" x1="0" y1="0" x2=".7" y2="1">
        <stop offset="0%" stop-color="#74b9ff" stop-opacity=".5"/><stop offset="55%" stop-color="#2c3e50" stop-opacity=".4"/>
        <stop offset="100%" stop-color="#1b2431" stop-opacity=".48"/>
      </linearGradient>
      <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#fff6c9" stop-opacity=".8"/>
        <stop offset="42%" stop-color="#f7dca0" stop-opacity=".3"/>
        <stop offset="100%" stop-color="#f7dca0" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="streakGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#fffdf4" stop-opacity="0"/>
        <stop offset="45%" stop-color="#fffdf4" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#fffdf4" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="lampPoolGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff3b0" stop-opacity=".5"/>
        <stop offset="58%" stop-color="#ffd166" stop-opacity=".18"/>
        <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
      </radialGradient>
      <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
        <feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".22" flood-color="#2d3436"/>
      </filter>
      <clipPath id="pouchClip"><use href="#pouchOutline"/></clipPath>
      <clipPath id="sceneClip"><rect x="0" y="0" width="1200" height="700"/></clipPath>
      <mask id="moonMask" maskUnits="userSpaceOnUse" x="-60" y="-60" width="120" height="120">
        <circle cx="0" cy="0" r="43" fill="#fff"/>
        <circle cx="17" cy="-11" r="39" fill="#000"/>
      </mask>

      <!-- 喉囊轮廓：被三次复用（底色 / 半透明膜 / 描边），小鱼因此能"沉在囊里" -->
      <path id="pouchOutline" d="M640 182 C690 200 786 207 828 196 C808 242 768 296 690 300 C640 303 616 248 630 190 Z"/>

      <!-- 轮组辐条：前后轮共用 -->
      <g id="spokeSet" stroke="#bbc9bf" stroke-linecap="round">
        <line x1="-71" y1="0" x2="71" y2="0" stroke-width="2.6"/>
        <line x1="0" y1="-71" x2="0" y2="71" stroke-width="2.6"/>
        <line x1="-50.2" y1="-50.2" x2="50.2" y2="50.2" stroke-width="2.1"/>
        <line x1="-50.2" y1="50.2" x2="50.2" y2="-50.2" stroke-width="2.1"/>
        <line x1="-65.6" y1="-27.2" x2="65.6" y2="27.2" stroke-width="1.8"/>
        <line x1="-27.2" y1="-65.6" x2="27.2" y2="65.6" stroke-width="1.8"/>
        <line x1="-65.6" y1="27.2" x2="65.6" y2="-27.2" stroke-width="1.8"/>
        <line x1="-27.2" y1="65.6" x2="27.2" y2="-65.6" stroke-width="1.8"/>
      </g>

      <!-- ===== 视差贴片：每个 tile 宽度 = 该层滚动周期，JS 按周期取模，永不错位 ===== -->
      <path id="cloudShape" d="M0 30 Q5 5 30 12 Q45 -5 67 8 Q89 -3 99 18 Q118 22 113 39 Q108 51 92 51 L14 51 Q-5 48 0 30 Z"/>
      <g id="tileCloud" fill="#fffdf4">
        <use href="#cloudShape" transform="translate(30,44) scale(1.2)"/>
        <use href="#cloudShape" transform="translate(268,104) scale(.82)"/>
        <use href="#cloudShape" transform="translate(432,26) scale(1.42)"/>
      </g>
      <g id="tileFence">
        <rect x="10" y="412" width="12" height="34" rx="3" fill="#e4e7d9" stroke="#747d8c" stroke-width="1.5"/>
      </g>
      <path id="tileWaveFar" d="M0 372 Q45 362 90 372 T180 372" fill="none" stroke="#fffdf4" stroke-width="2.4" stroke-linecap="round"/>
      <path id="tileWaveNear" d="M0 414 Q65 401 130 414 T260 414" fill="none" stroke="#fffdf4" stroke-width="3" stroke-linecap="round"/>
      <g id="tileRoadFar">
        <rect x="0" y="498" width="86" height="8" rx="4" fill="#d2b780" opacity=".8"/>
        <g fill="#2f353b" opacity=".45">
          <circle cx="34" cy="486" r="2.6"/><circle cx="112" cy="516" r="3.2"/><circle cx="76" cy="482" r="2"/>
        </g>
      </g>
      <g id="tileRoadMid">
        <rect x="0" y="530" width="70" height="6" rx="3" fill="#eef2f5" opacity=".82"/>
        <g fill="#3a4c45" opacity=".5">
          <circle cx="22" cy="566" r="3"/><circle cx="78" cy="602" r="3.8"/><circle cx="48" cy="586" r="2.4"/>
        </g>
      </g>
      <g id="tileRoadNear">
        <rect x="0" y="672" width="112" height="9" rx="4.5" fill="#eef2f5" opacity=".42"/>
        <g fill="#3a4c45" opacity=".45">
          <ellipse cx="46" cy="642" rx="6" ry="3"/><ellipse cx="152" cy="662" rx="8" ry="3.6"/>
        </g>
      </g>
      <g id="tileStreak" fill="url(#streakGrad)">
        <rect x="30" y="488" width="150" height="2.5" rx="1.25" opacity=".4"/>
        <rect x="252" y="520" width="190" height="3" rx="1.5" opacity=".55"/>
        <rect x="92" y="592" width="230" height="3.5" rx="1.75" opacity=".7"/>
        <rect x="300" y="664" width="170" height="4" rx="2" opacity=".55"/>
      </g>
      <g id="tileFeather" fill="#fffdf4">
        <path d="M120 606 Q142 590 152 606 Q136 612 120 606 Z" transform="rotate(24 136 602)"/>
        <path d="M560 658 Q582 642 592 658 Q576 664 560 658 Z" transform="rotate(-18 576 654)"/>
      </g>
    </defs>

    <g clip-path="url(#sceneClip)" style="isolation:isolate">

      <!-- SECTION: sky -->
      <rect x="0" y="0" width="1200" height="354" fill="url(#skyGrad)"/>

      <!-- SECTION: stars -->
      <g id="starsGroup" fill="#fffdf4" opacity="0">
        <circle class="tw" cx="112" cy="62" r="2.2"/><circle class="tw tw2" cx="248" cy="38" r="1.6"/>
        <circle class="tw tw3" cx="384" cy="92" r="2.5"/><circle class="tw tw2" cx="512" cy="48" r="1.8"/>
        <circle class="tw" cx="648" cy="84" r="2.1"/><circle class="tw tw3" cx="776" cy="36" r="1.6"/>
        <circle class="tw tw2" cx="896" cy="98" r="2.4"/><circle class="tw" cx="1024" cy="54" r="1.8"/>
        <circle class="tw tw3" cx="1136" cy="90" r="2.2"/><circle class="tw tw2" cx="188" cy="146" r="1.5"/>
        <circle class="tw" cx="462" cy="172" r="1.7"/><circle class="tw tw3" cx="734" cy="156" r="1.5"/>
        <circle class="tw tw2" cx="972" cy="180" r="1.8"/><circle class="tw" cx="1098" cy="146" r="1.4"/>
        <circle class="tw tw3" cx="322" cy="208" r="1.4"/><circle class="tw tw2" cx="848" cy="212" r="1.5"/>
        <circle class="tw" cx="596" cy="236" r="1.3"/><circle class="tw tw3" cx="64" cy="196" r="1.6"/>
      </g>

      <!-- SECTION: sun-moon -->
      <g id="sunGroup" transform="translate(176,138)">
        <circle id="sunHalo" r="136" fill="url(#sunGlow)"/>
        <circle id="sunDisc" r="46" fill="#fffbe7"/>
        <g id="sunRing"><circle r="62" fill="none" stroke="#fffdf4" stroke-width="2.5" opacity=".2" stroke-dasharray="2 10"/></g>
      </g>
      <g id="moonGroup" transform="translate(1005,148)" opacity="0">
        <circle r="72" fill="#e4e2c8" opacity=".06"/>
        <g mask="url(#moonMask)">
          <circle r="43" fill="#fdf3d0"/>
          <circle cx="-16" cy="14" r="7" fill="#e6d9a8" opacity=".55"/>
          <circle cx="-26" cy="-10" r="4.6" fill="#e6d9a8" opacity=".45"/>
          <circle cx="-4" cy="26" r="3.4" fill="#e6d9a8" opacity=".4"/>
        </g>
      </g>

      <!-- SECTION: islands（地平线剪影，视为无穷远，不参与滚动） -->
      <g id="layerIslands" fill="#89aaa0">
        <path d="M20 358 Q110 296 204 358 Z" opacity=".5"/>
        <path d="M292 358 Q418 264 548 358 Z" opacity=".38"/>
        <path d="M628 358 Q694 316 762 358 Z" opacity=".46"/>
        <path d="M1024 358 Q1112 300 1200 358 Z" opacity=".42"/>
      </g>

      <!-- SECTION: clouds -->
      <g id="layerClouds" fill="#fffdf4" opacity=".9"></g>

      <!-- SECTION: seagulls -->
      <g id="gull1">
        <ellipse cx="30" cy="1" rx="9" ry="4.2" fill="#2f3542"/>
        <path id="gullWing1" d="M0 0 Q15 -19 30 0 Q45 -19 60 0" fill="none" stroke="#2f3542" stroke-width="3.4" stroke-linecap="round"/>
      </g>
      <g id="gull2">
        <ellipse cx="22" cy="1" rx="7" ry="3.2" fill="#57606f"/>
        <path id="gullWing2" d="M0 0 Q11 -14 22 0 Q33 -14 44 0" fill="none" stroke="#57606f" stroke-width="2.8" stroke-linecap="round"/>
      </g>

      <!-- SECTION: sea -->
      <rect x="0" y="352" width="1200" height="94" fill="url(#seaGrad)"/>
      <rect x="0" y="352" width="1200" height="3" fill="#fffdf4" opacity=".32"/>
      <g id="sunGlitter"></g>
      <g id="layerWaveFar" opacity=".5"></g>
      <g id="layerWaveNear" opacity=".34"></g>

      <!-- SECTION: lighthouse（画在海面之后，礁石正好没入水线；灯光扫射由 JS 驱动） -->

  /* SECTION: render —— 每帧统一写入，机械件之间永不脱节 */
  var tRide = 0, tEnv = 0;

      ' 1) translate(-572 -244)');
    setA(tailWag, 'transform', 'rotate(' + f(3.4 * Math.sin(tEnv * 2.3)) + ' 0 6)');

    /* 小鱼在喉囊内部游动，clipPath 与膜层共用同一轮廓。 */
    setA(fishPeek, 'transform', 'translate(' + f(5 * Math.sin(tEnv * 1.3)) + ' ' + f(4 * Math.sin(tEnv * 2.1)) + ') rotate(' + f(-6 + 5 * Math.sin(tEnv * 1.7)) + ')');

    /* 眨眼 */
    nextBlink -= dtE;
    if (nextBlink <= 0 && blinkT <= 0) { blinkT = 0.15; nextBlink = 2.2 + Math.random() * 3.8; }
    if (blinkT > 0) blinkT -= dtE;
    var sy = 1;
    if (blinkT > 0) sy = Math.abs(Math.cos((1 - blinkT / 0.15) * Math.PI));
    setA(eyeBlink, 'transform', 'scale(1 ' + f(Math.max(0.06, sy)) + ')');

    /* 海鸥 */
    var g1 = (tEnv / 13) % 1;
    setA(gull1, 'transform', 'translate(' + f(1340 - 1600 * g1) + ' ' + f(96 + 13 * Math.sin(tEnv * 0.9)) + ') scale(.62)');
    setA(gullW1, 'transform', 'scale(1 ' + f(1 - 1.72 * (0.5 + 0.5 * Math.sin(tEnv * 13))) + ')');
    var g2 = ((tEnv + 7) / 19) % 1;
    setA(gull2, 'transform', 'translate(' + f(1340 - 1600 * g2) + ' ' + f(172 + 10 * Math.sin(tEnv * 0.7 + 2)) + ') scale(.46)');
    setA(gullW2, 'transform', 'scale(1 ' + f(1 - 1.72 * (0.5 + 0.5 * Math.sin(tEnv * 11 + 1))) + ')');

    /* 水面反光 + 太阳环 */
    var lightX = cur.sunX * (1 - cur.moon) + 1005 * cur.moon;
    setA(sunGlitter, 'transform', 'translate(' + f(lightX) + ' 0)');
    for (i = 0; i < GLIT.length; i++) {
      setA(GLIT[i], 'opacity', f(cur.glit * (0.3 + 0.7 * Math.abs(Math.sin(tEnv * 1.6 + i * 1.7)))));
    }
    setA(sunRing, 'transform', 'rotate(' + f((tEnv * 4) % 360) + ')');
    setA(lhBeam, 'transform', 'translate(901 257) rotate(' + f(30 * Math.sin(tEnv * 0.55)) + ')');
    setA(lhBeam, 'opacity', f(cur.lamp * 0.55));
    setA(lhLamp, 'opacity', f(0.2 + 0.8 * cur.lamp));

    /* 扬尘 */
    var damp = Math.min(1, speedMult * 1.1);
    for (i = 0; i < DUST.length; i++) {
      var D = DUST[i], p = (tRide * 1.3 + D.ph) % 1;
      setA(D.el, 'r', f(5 + 18 * p));
      setA(D.el, 'cx', f(334 - 126 * p));
      setA(D.el, 'cy', f(604 - 52 * p - 14 * p * p));
      setA(D.el, 'opacity', f(Math.sin(Math.PI * p) * 0.4 * damp));
    }

    /* 车铃摆动 + 音符 */
    if (bellT >= 0) {
      bellT += dtE;
      if (bellT > 0.62) { bellT = -1; setA(bellShake, 'transform', 'rotate(0 0 8)'); }
      else setA(bellShake, 'transform', 'rotate(' + f(15 * Math.exp(-bellT * 7) * Math.sin(bellT * 46)) + ' 0 8)');
    }
    if (noteT >= 0) {
      noteT += dtE;
      if (noteT > 1.5) { noteT = -1; setA(noteGroup, 'opacity', '0'); }
      else {
        setA(noteGroup, 'opacity', '1');
        for (i = 0; i < 3; i++) {
          var nt = Math.max(0, noteT - i * 0.16), pr = clamp(nt / 1.1, 0, 1);
          var op = pr < 0.12 ? pr / 0.12 : 1 - Math.max(0, (pr - 0.55) / 0.45);
          setA(notes[i], 'transform', 'translate(' + f(30 * pr + i * 17) + ' ' + f(-86 * pr) +
            ') scale(' + f(0.55 + 0.85 * pr) + ') rotate(' + f(-14 + 34 * pr) + ')');
          setA(notes[i], 'opacity', f(clamp(op, 0, 1)));
        }
      }
    }
  }

  /* SECTION: loop —— 单一时钟：tRide 受档位缩放（传动与视差），tEnv 不受（生物与光效） */
  var speedMult = 1, isPaused = false, last = 0;
  function tick(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000; last = now;
    if (dt > 0.1) dt = 0.1;                       // 切回前台时不瞬移
    if (document.hidden) { requestAnimationFrame(tick);return; }
    if (!isPaused) { tEnv += dt; tRide += dt * speedMult; }
    updatePalette(dt);
    render(isPaused && bellT<0 && honkT<0 && noteT<0 ? 0 : dt);
    requestAnimationFrame(tick);
  }

  /* SECTION: controls */
  function setPaused(v) {
    isPaused = v;
    if (v) stage.classList.add('is-paused'); else stage.classList.remove('is-paused');
    pauseBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
    pauseLbl.textContent = v ? '继续骑行' : '暂停骑行';
    pauseIco.innerHTML = v ? '<svg viewBox="0 0 20 20"><path d="m6 3 10 7-10 7Z"/></svg>' : '<svg viewBox="0 0 20 20"><path d="M6 4v12M14 4v12"/></svg>';
    pauseBtn.setAttribute('aria-label',v?'继续骑行':'暂停骑行');
    if (badge) badge.style.display = 'none';
  }
  function setSpeed(v) {
    if (!isFinite(v)) v = 1;
    speedMult = v;
    speedVal.textContent = v.toFixed(1) + '×';
    speedRange.setAttribute('aria-valuetext', v.toFixed(1) + ' 倍速');
  }
  function applyMode(i) {
    modeIdx = i;
    document.body.className = ['', 'mode-sunset', 'mode-night'][i];
    document.querySelectorAll('[data-mode]').forEach(function(btn){btn.setAttribute('aria-pressed',String(Number(btn.dataset.mode)===i));});
    $('weatherText').textContent = ['晨光 · 微风 · 宜出游','落日 · 晚风 · 慢慢骑','星夜 · 听海 · 灯已亮'][i];
    $('liveStatus').textContent = '已切换至'+MODES[i].lbl;
    tgt = cloneP(pack(MODES[i]));
    modeIco.textContent = MODES[i].ico;
    modeLbl.textContent = MODES[i].lbl;
    modeBtn.setAttribute('aria-label', '切换晨昏，当前：' + MODES[i].lbl);
  }
  function nextMode() { applyMode((modeIdx + 1) % MODES.length); }

  /* SECTION: audio —— Web Audio 现场合成，不依赖任何外部音频文件 */
  var audioCtx = null, master = null;
  function ac() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC(); } catch (e) { return null; }
      master = audioCtx.createGain();
      master.gain.value = 0.5;
      master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
    return audioCtx;
  }
  function bellTone(ctx, freq, t0, vol) {
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);      // 极短起音，消掉爆音
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.42);
    osc.connect(gain); gain.connect(master);
    osc.start(t0); osc.stop(t0 + 0.45);
  }
  function honkVoice(ctx, t0, dur) {
    var osc = ctx.createOscillator(), mod = ctx.createOscillator();
    var modGain = ctx.createGain(), gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, t0);
    osc.frequency.exponentialRampToValueAtTime(128, t0 + dur);
    mod.type = 'square';
    mod.frequency.setValueAtTime(46, t0);
    modGain.gain.setValueAtTime(130, t0);
    mod.connect(modGain); modGain.connect(osc.frequency);         // 调制深度必须经 modGain 才生效
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.26, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain); gain.connect(master);
    mod.start(t0); osc.start(t0);
    mod.stop(t0 + dur + 0.03); osc.stop(t0 + dur + 0.03);
  }

  /* SECTION: fx */
  function ringBell() {
    var ctx = ac();
    if (ctx) {
      var t = ctx.currentTime;
      bellTone(ctx, 2093, t, 0.3); bellTone(ctx, 2637, t + 0.11, 0.24); bellTone(ctx, 3488, t + 0.02, 0.09);
    }
    bellT = 0; noteT = 0;
  }
  function pelicanHonk() {
    var ctx = ac();
    if (ctx) { var t = ctx.currentTime; honkVoice(ctx, t, 0.22); honkVoice(ctx, t + 0.26, 0.3); }
    honkT = 0;
  }

  /* SECTION: events */
  pauseBtn.addEventListener('click', function () { setPaused(!isPaused); });
  $('bellBtn').addEventListener('click', ringBell);
  $('honkBtn').addEventListener('click', pelicanHonk);
  modeBtn.addEventListener('click', nextMode);
  speedRange.addEventListener('input', function () { setSpeed(parseFloat(speedRange.value)); });
  bellShake.addEventListener('click', function (e) { e.stopPropagation(); ringBell(); });
  bellShake.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.code === 'Space') { e.preventDefault(); e.stopPropagation(); ringBell(); }
  });
  window.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tn = (e.target && e.target.tagName) || '';
    if (e.code === 'Space' || e.key === ' ') {
      if (tn === 'BUTTON' || tn === 'INPUT') return;              // 焦点在控件上时交给控件自身
      e.preventDefault(); setPaused(!isPaused); return;
    }
    if (tn === 'INPUT' || tn === 'TEXTAREA') return;
    var k = e.key;
    if (k === 'b' || k === 'B') ringBell();
    else if (k === 'h' || k === 'H') pelicanHonk();
    else if (k === 't' || k === 'T') nextMode();
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) last = 0; });


  document.querySelectorAll('[data-mode]').forEach(function(btn){btn.addEventListener('click',function(){applyMode(Number(btn.dataset.mode));});});
  function fitScene(){ $('scene').setAttribute('viewBox',window.innerWidth<=700&&!document.fullscreenElement?'200 50 750 620':'0 40 1200 630'); }
  fitScene();window.addEventListener('resize',fitScene);
  $('focusBtn').addEventListener('click',function(){
    if(document.fullscreenElement){document.exitFullscreen().catch(function(){});}
    else if(stage.requestFullscreen){stage.requestFullscreen().catch(function(){ $('liveStatus').textContent='当前浏览器未启用全屏'; });}
  });
  document.addEventListener('fullscreenchange',function(){
    $('focusBtn').setAttribute('aria-label',document.fullscreenElement?'退出全屏':'全屏观看');
    if(document.fullscreenElement)$('scene').setAttribute('viewBox','0 40 1200 630');else fitScene();
  });

  /* SECTION: boot */
  applyMode(0);
  cur = cloneP(tgt);
  setSpeed(parseFloat(speedRange.value));
  for (var ni = 0; ni < notes.length; ni++) notes[ni].setAttribute('opacity', '0');
  updatePalette(0.016);
  render(0);
  var motionPreference=window.matchMedia('(prefers-reduced-motion: reduce)');
  motionPreference.addEventListener('change',function(e){if(e.matches)setPaused(true);});
  var reduce = motionPreference.matches;
  setPaused(!!reduce);
  if (reduce && badge) badge.style.display = 'block';
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
